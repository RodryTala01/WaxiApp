name: Verificar WaxiApp
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node build.mjs
  navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install chromium --only-shell
      - run: python3 -m http.server 5174 --bind 127.0.0.1 > /tmp/waxi-http.log 2>&1 &
      - run: node tests/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-navegador
          path: /tmp/waxi-smoke
